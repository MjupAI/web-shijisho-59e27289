<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light"><title>かんたんコース 指示書</title>
<style>
:root{--bg:#f4f7fc;--card:#fff;--ink:#17233d;--sub:#566380;--line:#dde4f2;--brand:#2f6df0;--brand-d:#2456c8;--ok:#16a34a;--r:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:17px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
header.top{background:linear-gradient(135deg,#e1306c,#f77737);color:#fff;padding:28px 0 58px}
header.top .wrap{padding-bottom:0;position:relative}
.bigbtn{display:block;margin:12px 0 0;min-height:44px;padding:0 16px;border-radius:99px;border:2px solid #fff;background:rgba(255,255,255,.15);color:#fff;font-weight:800;font-size:15px;cursor:pointer}body.big{font-size:21px}body.big .small{font-size:16px}body.big .copybox pre{font-size:19px}
header.top .eyebrow{font-size:13px;letter-spacing:.12em;opacity:.9}
header.top h1{margin:4px 0 6px;font-size:28px}
header.top p{margin:0;opacity:.95;font-size:15px}
main{margin-top:-34px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 2px 10px rgba(30,50,100,.06)}
.stack>*+*{margin-top:18px}
h2{font-size:21px;margin:0 0 10px}
.small{font-size:14px;color:var(--sub)}
.flowbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.flowbar div{background:#fff3ea;border:1px solid #ffd9bf;border-radius:12px;padding:10px 12px;font-weight:700;font-size:15px;text-align:center}
@media(max-width:600px){.flowbar{grid-template-columns:1fr}}
table.items{border-collapse:collapse;width:100%;margin-top:6px}table.items td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;font-size:15.5px}table.items td:first-child{background:#f5f8ff;font-weight:700;width:34%}
.warn{background:#fff7de;border-left:6px solid #f0b429;border-radius:10px;padding:10px 14px;font-size:15.5px;margin-top:12px}
.okbox{background:#eaf8ef;border-left:6px solid var(--ok);border-radius:10px;padding:8px 14px;font-size:15.5px;margin-top:10px}
.okbox b{color:#116b35}
nav.tabs{position:sticky;top:0;z-index:5;background:rgba(244,247,252,.95);backdrop-filter:blur(6px);padding:10px 16px;margin:0 -16px;display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs a{flex:none;min-height:44px;display:inline-flex;align-items:center;padding:4px 16px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:15.5px;font-weight:700}
nav.tabs a.on{background:var(--brand);border-color:var(--brand);color:#fff}
.bar{height:10px;background:#e3e9f6;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.step{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px;background:#fff}
.step.done{background:#f1faf4;border-color:#b6e4c6}
.step header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.step.done .num{background:var(--ok)}
.step h3{margin:0;font-size:18px;flex:1 1 200px}
label.ok{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 6px;font-size:15px;font-weight:700;cursor:pointer;color:var(--sub)}
label.ok input{width:24px;height:24px;accent-color:var(--ok)}
.body{margin:6px 0 0 50px}@media(max-width:560px){.body{margin-left:0}}
.body p{margin:6px 0}
.shot{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:zoom-in}
.shotf{margin:10px 0}.shotf figcaption{font-size:15px;font-weight:700;margin-top:4px}.shotf .shot{margin:0}
.cap{font-size:13.5px;color:var(--sub);margin:-2px 0 6px}
.copybox{border:1.5px solid #cfd9f2;border-radius:12px;background:#f7f9ff;margin:10px 0;overflow:hidden}
.copybox .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#eaf0ff;padding:6px 10px 6px 14px;font-weight:700;font-size:14.5px;color:var(--brand-d)}
.copybox pre{margin:0;padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:16px;line-height:1.7}
.copybox pre mark{background:#ffe98a;border-radius:4px;padding:0 3px}
.copy{flex:none;min-height:40px;padding:0 16px;border-radius:10px;border:1.5px solid var(--brand);background:#fff;color:var(--brand-d);font-weight:800;font-size:14.5px;cursor:pointer}
.copy.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.dls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0}
a.dl{display:flex;align-items:center;gap:12px;border:2px solid var(--brand);border-radius:14px;padding:10px;text-decoration:none;color:var(--ink);background:#f7faff;min-height:64px}
a.dl img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#fff}
a.dl:hover{background:#eaf2ff}
details.more{border:1px solid var(--line);border-radius:12px;padding:2px 14px;margin:8px 0;background:#fafbff}
details.more summary{min-height:44px;display:flex;align-items:center;font-weight:800;cursor:pointer}
details.more ol{margin:4px 0 10px;padding-left:22px}details.more li{margin:6px 0}
.chk{display:flex;align-items:flex-start;gap:10px;min-height:44px;margin:6px 0;font-size:16.5px}
.chk input{width:24px;height:24px;margin-top:4px;accent-color:var(--ok)}
table.help{border-collapse:collapse;width:100%}table.help td{border:1px solid var(--line);padding:10px 12px;vertical-align:top}table.help td:first-child{background:#fff7de;font-weight:700;width:42%}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:12px;background:var(--brand);color:#fff;font-weight:800;text-decoration:none}
#lb{position:fixed;inset:0;background:rgba(15,23,42,.88);display:none;align-items:center;justify-content:center;z-index:20;padding:16px;cursor:zoom-out}#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:10px;background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:#17233d;color:#fff;padding:10px 20px;border-radius:99px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:30}.toast.on{opacity:1;transform:translate(-50%,0)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #ffb000;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{header.top,nav.tabs,.toast,.copy{display:none}body{background:#fff}.card,.step{box-shadow:none;break-inside:avoid}}
.navrow{display:flex;gap:10px;margin-top:16px}.navrow .btn{flex:1;border:0;font-size:17px;cursor:pointer}.btn.alt{background:#fff;color:var(--brand-d);border:2px solid var(--brand);cursor:pointer}.btn[disabled]{opacity:.4}.linkbtn{background:none;border:0;color:var(--brand-d);text-decoration:underline;font-size:15px;min-height:44px;cursor:pointer}
</style>
<style>.tag{display:inline-block;background:#eaf0ff;color:var(--brand-d);border-radius:8px;padding:0 8px;font-weight:700;font-size:14px}.body ul,.body ol{padding-left:24px;margin:6px 0}.body li{margin:6px 0}.body td{font-size:16px}.copycell{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.copycell .copy{min-height:36px;padding:0 12px}.tblw{overflow-x:auto}.body h4{margin:16px 0 4px;font-size:17px}.hero{padding:6px 0}.step,.body{min-width:0;overflow-wrap:anywhere}.tblw{max-width:100%}body{overflow-x:hidden}.copycell+.copycell{margin-top:8px}</style>
</head><body>
<header class="top"><div class="wrap"><div class="eyebrow">ESPICT SCHOOL</div><h1>かんたんコース　指示書</h1><p>STUDIOのブログに、記事を1本足して、提出します</p><button id="big" class="bigbtn" type="button" aria-pressed="false">文字を大きくする</button></div></header>
<main class="wrap"><nav class="tabs" id="tabs" aria-label="コースの切り替え"></nav><div id="view" class="stack" style="margin-top:16px"></div></main>
<div id="lb" role="dialog" aria-label="画像の拡大"><img alt=""></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
let store={};try{store=JSON.parse(localStorage.getItem('web-shijisho')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('web-shijisho',JSON.stringify(store))}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1400)};
const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.trim()};
const copyText=async t=>{try{await navigator.clipboard.writeText(t);return true}catch(e){try{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(_){return false}}};
let showAll=false;
function steps(d){
 const S=[];
 S.push({t:'この作業について',blocks:d.intro,intro:true});
 d.secs.forEach(s=>S.push({t:s.title.replace(/^\d+\.\s*/,''),n:(s.title.match(/^(\d+)\./)||[])[1],blocks:s.blocks}));
 return S}
function blockHTML(b,hdr){
 if(b.t==='p')return`<p>${b.x}</p>`;
 if(b.t==='h3')return`<h4>${b.x}</h4>`;
 if(b.t==='img')return`<img class="shot" src="${b.src}" alt="${b.alt}">`;
 if(b.t==='ul'||b.t==='ol'){const tag=b.t;const subs=b.sub||[];
  return`<${tag}${tag==='ol'&&b.start>1?` start="${b.start}"`:''}>${b.items.map(x=>`<li>${x}</li>`).join('')}</${tag}>`+subs.map(s=>`<ul class="subn">${s.map(x=>`<li>${x}</li>`).join('')}</ul>`).join('')}
 if(b.t==='table'){const rows=b.rows;const head=rows[0]||[];const ci=head.findIndex(h=>/入れる文|入れる物/.test(h));
  const copyCol=head.findIndex(h=>/入れる文|入れる物/.test(h));
  return`<div class="tblw"><table class="items">${rows.map((r,ri)=>`<tr>${r.map((c,i)=>{const th=ri===0;const st=th?' style="background:#eaf0ff;font-weight:800"':'';
   if(!th&&i===copyCol&&c){const ls=c.split('<br>').filter(x=>strip(x));return`<td>${ls.map(l=>`<div class="copycell"><span>${l}</span><button class="copy" data-copy="${strip(l).replace(/"/g,'&quot;')}">コピー</button></div>`).join('')}${ls.length>1?'<div class="small">1行ずつ、「コピー」→貼り付け→Enter を くり返します</div>':''}</td>`}
   return`<td${st}>${c}</td>`}).join('')}</tr>`).join('')}</table></div>`}
 return''}
function stepHTML(code,s,i){
 const k=code+'.'+i,d=!!store[k];
 return`<section class="step${d?' done':''}" id="st-${i}"><header><span class="num">${d?'✓':(s.intro?'★':(s.n??i))}</span><h3>${s.t}</h3><label class="ok"><input type="checkbox" data-k="${k}" ${d?'checked':''}>できた</label></header><div class="body">${s.blocks.map(blockHTML).join('')}</div></section>`}
function view(){
 const h=location.hash.replace(/^#\/?/,'')||DOCS[0].code;
 $('#tabs').innerHTML=DOCS.map(d=>`<a href="#/${d.code}" class="${d.code===h?'on':''}">${d.label}</a>`).join('');
 const d=DOCS.find(x=>x.code===h)||DOCS[0];const S=steps(d);const n=S.length;
 let c=+(store['cur.'+d.code]||0);if(c<0||c>=n)c=0;
 const done=S.filter((_,i)=>store[d.code+'.'+i]).length;
 let html=`<section class="card"><h2 style="margin-bottom:4px">${d.title}</h2><div class="bar" style="margin-top:10px"><i id="bar" style="width:${done/n*100}%"></i></div><div class="small" id="barlab" style="margin-top:6px">${done} / ${n} 終わった</div></section>`;
 if(showAll){html+=`<p style="text-align:center;margin:0"><button class="btn alt" id="toone" type="button">1つずつ表示にもどす</button></p>`+S.map((s,i)=>stepHTML(d.code,s,i)).join('')}
 else{html+=`<div class="small" style="text-align:center">${c+1} / ${n} 番目</div>`+stepHTML(d.code,S[c],c)+`<div class="navrow"><button class="btn alt" id="prev" type="button" ${c===0?'disabled':''}>← もどる</button><button class="btn" id="next" type="button">${c===n-1?'ぜんぶ終わり':'できた → 次へ'}</button></div><p style="text-align:center;margin:8px 0 0"><button class="linkbtn" id="toall" type="button">ぜんぶの手順を一覧で見る</button></p>`}
 $('#view').innerHTML=html;
 const go=dd=>{store['cur.'+d.code]=Math.max(0,Math.min(n-1,c+dd));save();view();scrollTo(0,0)};
 const nx=$('#next');if(nx)nx.addEventListener('click',()=>{store[d.code+'.'+c]=1;save();if(c>=n-1){toast('おつかれさまでした');view();return}go(1)});
 const pv=$('#prev');if(pv)pv.addEventListener('click',()=>go(-1));
 const ta=$('#toall');if(ta)ta.addEventListener('click',()=>{showAll=true;view()});
 const to=$('#toone');if(to)to.addEventListener('click',()=>{showAll=false;view()});
 document.querySelectorAll('input[data-k]').forEach(el=>el.addEventListener('change',()=>{store[el.dataset.k]=el.checked?1:0;save();const sec=el.closest('.step');sec.classList.toggle('done',el.checked)}));
}
document.addEventListener('click',async e=>{
 const si=e.target.closest('img.shot');if(si){const lb=$('#lb');$('img',lb).src=si.src;lb.classList.add('on');return}
 if(e.target.closest('#lb')){$('#lb').classList.remove('on');return}
 const b=e.target.closest('.copy');if(!b)return;const ok=await copyText(b.dataset.copy);
 if(ok){b.classList.add('ok');b.textContent='コピーした';toast('コピーしました');setTimeout(()=>{b.classList.remove('ok');b.textContent='コピー'},1400)}else toast('コピーできませんでした。文を選んで、手でコピーしてください')});
addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on')});
addEventListener('hashchange',()=>{view();scrollTo(0,0)});
try{if(localStorage.getItem('sns-big')==='1'){document.body.classList.add('big');$('#big').setAttribute('aria-pressed','true')}}catch(e){}
$('#big').addEventListener('click',()=>{const on=document.body.classList.toggle('big');$('#big').setAttribute('aria-pressed',on);try{localStorage.setItem('sns-big',on?'1':'0')}catch(e){}});
view();
</script></body></html>
